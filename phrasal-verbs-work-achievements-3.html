<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary: Phrasal verbs — Work &amp; Achievements (3)</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #174f73;
      --blue: #1769aa;
      --orange: #ee5a00;
      --orange-dark: #c94c00;
      --green: #168653;
      --green-soft: #eaf8f1;
      --red: #c23d30;
      --red-soft: #fff1ee;
      --ink: #17212f;
      --muted: #667085;
      --line: #d5dfe7;
      --page: #edf3f8;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(16,42,67,.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, #dff1ff 0, transparent 29rem),
        var(--page);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 30px));
      margin: 28px auto;
      overflow: hidden;
      border-radius: 23px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .header {
      position: relative;
      padding: 36px 52px 31px;
      overflow: hidden;
      color: var(--white);
      background: linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 70%, #187ca9 100%);
    }

    .header::after {
      content: "";
      position: absolute;
      top: -105px;
      right: -55px;
      width: 300px;
      height: 300px;
      border: 42px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }

    .unit {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: #bceaff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 940px;
      margin: 0;
      font-size: clamp(30px, 4vw, 47px);
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    .content { padding: 32px 52px 46px; }

    .intro {
      display: grid;
      grid-template-columns: 1fr minmax(230px, 290px);
      gap: 22px;
      align-items: end;
    }

    .instruction {
      margin: 0 0 5px;
      color: var(--navy);
      font-size: clamp(21px, 2.5vw, 28px);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .name-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .name-field input {
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 1.5px solid #afbdc9;
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .name-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.12);
    }

    .name-field input:disabled {
      color: var(--ink);
      background: #f7f9fb;
      opacity: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 0 17px;
      padding: 11px 15px;
      border: 1px solid #d9e5ee;
      border-radius: 11px;
      color: var(--navy);
      background: #f6fbff;
      font-size: 14px;
      font-weight: 700;
    }

    .attempt {
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e7f3fc;
      white-space: nowrap;
    }

    .message {
      display: none;
      margin: 0 0 17px;
      padding: 12px 15px;
      border-radius: 10px;
      color: #932d22;
      background: var(--red-soft);
      font-weight: 700;
    }

    .message.show { display: block; }

    .email-card {
      position: relative;
      padding: 29px 31px 31px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
    }

    .email-label {
      display: inline-block;
      margin-bottom: 15px;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e8f3fc;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .email-text {
      margin: 0;
      color: #111827;
      font-size: clamp(18px, 2vw, 22px);
      line-height: 2.35;
    }

    .answer-input {
      width: calc(var(--letters) * 1ch + 30px);
      min-width: 76px;
      max-width: 175px;
      height: 43px;
      margin: 0 4px;
      padding: 5px 9px;
      border: 1.6px solid #87939f;
      border-radius: 6px;
      color: #111827;
      background: #fff;
      text-align: center;
      text-transform: lowercase;
      font-weight: 700;
      outline: none;
      vertical-align: middle;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .answer-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.14);
    }

    .answer-input.attention {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(194,61,48,.12);
    }

    .answer-input.correct {
      border-color: #4dac7b;
      color: #11643d;
      background: #f2fcf7;
    }

    .answer-input.wrong {
      border-color: #dc7467;
      color: #a12e23;
      background: #fff8f6;
    }

    .answer-input:disabled {
      opacity: 1;
      cursor: default;
    }

    .result {
      display: none;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 0 0 20px;
      padding: 21px 23px;
      border: 2px solid;
      border-radius: 15px;
    }

    .result.show { display: grid; }
    .result.success { border-color: #38a36d; background: linear-gradient(135deg, #e8f8ef, #f9fffb); }
    .result.failure { border-color: #e78776; background: linear-gradient(135deg, #fff0ec, #fffaf8); }

    .score {
      display: grid;
      place-items: center;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.18);
      text-align: center;
    }

    .success .score { background: var(--green); }
    .failure .score { background: var(--red); }

    .percentage { display: block; font-size: 29px; line-height: 1; font-weight: 900; }
    .fraction { display: block; margin-top: 5px; font-size: 14px; font-weight: 800; }
    .result-title { margin: 0 0 4px; color: var(--navy); font-size: 25px; }
    .result-text { margin: 0; font-size: 16px; }
    .result-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    .answer-review {
      display: none;
      margin-top: 19px;
      padding: 20px;
      border: 1px solid #d7e2ea;
      border-radius: 14px;
      background: #f8fbfd;
    }

    .answer-review.show { display: block; }

    .answer-review h3 {
      margin: 0 0 13px;
      color: var(--navy);
      font-size: 19px;
    }

    .review-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .review-item {
      padding: 10px 12px;
      border-radius: 9px;
      color: #12653f;
      background: var(--green-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .review-item.was-wrong {
      color: #982d23;
      background: var(--red-soft);
    }

    .review-item small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 11px;
      margin-top: 23px;
    }

    .action-button {
      min-height: 48px;
      padding: 11px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease;
    }

    .action-button:hover { transform: translateY(-1px); }
    .action-button:focus-visible { outline: 4px solid rgba(23,105,170,.25); outline-offset: 2px; }
    .primary { color: #fff; background: var(--orange); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: var(--navy); background: #e7eef4; }
    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .page { width: min(100% - 18px, 1180px); margin: 9px auto; border-radius: 15px; }
      .header, .content { padding-left: 21px; padding-right: 21px; }
      .header { padding-top: 28px; }
      .intro { grid-template-columns: 1fr; }
      .email-card { padding: 22px 17px 24px; }
      .email-text { line-height: 2.55; }
      .answer-input { min-width: 68px; max-width: 155px; margin: 0 2px; }
      .review-list { grid-template-columns: 1fr; }
      .result.show { grid-template-columns: 1fr; text-align: center; }
      .score { margin: 0 auto; }
      .actions { justify-content: stretch; }
      .action-button { flex: 1; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .actions, .hint { display: none !important; }
      .email-card, .answer-review { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="unit" id="unitLabel"></p>
      <h1 id="quizTitle"></h1>
    </header>

    <section class="content">
      <div class="intro">
        <div>
          <h2 class="instruction" id="instruction"></h2>
          <p class="hint">Type both parts of each phrasal verb. Complete every blank before checking.</p>
        </div>
        <div class="name-field">
          <label for="studentName">Student name (for the final screenshot)</label>
          <input id="studentName" type="text" maxlength="60" placeholder="Enter your name" autocomplete="name">
        </div>
      </div>

      <div class="toolbar">
        <span id="progressText">0/10 answers completed</span>
        <span class="attempt" id="attemptBadge">Attempt 1</span>
      </div>

      <div class="message" id="message" role="alert"></div>

      <section class="result" id="resultPanel" aria-live="polite">
        <div class="score">
          <div>
            <span class="percentage" id="percentage">0%</span>
            <span class="fraction" id="fraction">0/10</span>
          </div>
        </div>
        <div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-text" id="resultText"></p>
          <p class="result-meta" id="resultMeta"></p>
        </div>
      </section>

      <form id="quizForm" novalidate>
        <article class="email-card">
          <span class="email-label">Email</span>
          <p class="email-text" id="emailText"></p>
        </article>

        <section class="answer-review" id="answerReview" aria-live="polite">
          <h3>Correct answers</h3>
          <ol class="review-list" id="reviewList"></ol>
        </section>

        <div class="actions">
          <button class="action-button primary" id="checkButton" type="submit">✓ Check answers</button>
          <button class="action-button secondary hidden" id="retryButton" type="button">Try again</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /* ===========================================================
       TEACHER EDITING AREA
       words = the exact forms required in the email.
       base = the dictionary form of the phrasal verb.
       =========================================================== */
    const settings = {
      title: "Vocabulary: Phrasal verbs: work & achievements (3)",
      unit: "STUDIO Advanced | Unit 5A",
      instruction: "Complete the email with the correct phrasal verbs."
    };

    const answers = [
      { id: "take", words: ["taken", "on"], base: "take on" },
      { id: "pore", words: ["poring", "over"], base: "pore over" },
      { id: "grapple", words: ["grappling", "with"], base: "grapple with" },
      { id: "pay", words: ["paid", "off"], base: "pay off" },
      { id: "single", words: ["singled", "out"], base: "single out" },
      { id: "play", words: ["played", "down"], base: "play down" },
      { id: "walk", words: ["walk", "away"], base: "walk away with" },
      { id: "shrug", words: ["shrugging", "off"], base: "shrug off" },
      { id: "put", words: ["put", "down"], base: "put down to" },
      { id: "hold", words: ["holding", "back"], base: "hold back" }
    ];

    const emailParts = [
      { text: "I'm writing to express my dismay at being overlooked for promotion once again. I was " },
      { answer: "take", part: 0 }, { answer: "take", part: 1 },
      { text: " as a research assistant because I had exactly the qualifications you were looking for. Since then, I've spent countless hours " },
      { answer: "pore", part: 0 }, { answer: "pore", part: 1 },
      { text: " experimental data and " },
      { answer: "grapple", part: 0 }, { answer: "grapple", part: 1 },
      { text: " the problems they reveal. This hard work has " },
      { answer: "pay", part: 0 }, { answer: "pay", part: 1 },
      { text: " on numerous occasions and led to new discoveries. However, despite these achievements, it's never me who's " },
      { answer: "single", part: 0 }, { answer: "single", part: 1 },
      { text: " for promotion. Instead, my contributions always get " },
      { answer: "play", part: 0 }, { answer: "play", part: 1 },
      { text: ", and it's invariably male colleagues who " },
      { answer: "walk", part: 0 }, { answer: "walk", part: 1 },
      { text: " with managerial jobs. I could keep " },
      { answer: "shrug", part: 0 }, { answer: "shrug", part: 1 },
      { text: " this lack of recognition and pretend it doesn't matter, or " },
      { answer: "put", part: 0 },
      { text: " it " },
      { answer: "put", part: 1 },
      { text: " to me not being the best candidate. However, I get the growing feeling that what's really " },
      { answer: "hold", part: 0 },
      { text: " me " },
      { answer: "hold", part: 1 },
      { text: " is being a woman in a male-dominated environment. I think this is a possibility that those of you who occupy senior management roles need to take very seriously." }
    ];

    const answerMap = new Map(answers.map(function (answer, index) {
      return [answer.id, Object.assign({ number: index + 1 }, answer)];
    }));

    const emailText = document.getElementById("emailText");
    const form = document.getElementById("quizForm");
    const studentName = document.getElementById("studentName");
    const message = document.getElementById("message");
    const resultPanel = document.getElementById("resultPanel");
    const answerReview = document.getElementById("answerReview");
    const reviewList = document.getElementById("reviewList");
    const checkButton = document.getElementById("checkButton");
    const retryButton = document.getElementById("retryButton");

    let attempt = 1;
    let locked = false;

    document.title = settings.title;
    document.getElementById("quizTitle").textContent = settings.title;
    document.getElementById("unitLabel").textContent = settings.unit;
    document.getElementById("instruction").textContent = settings.instruction;

    function inputsFor(answerId) {
      return Array.from(document.querySelectorAll('.answer-input[data-answer="' + answerId + '"]'))
        .sort(function (first, second) { return Number(first.dataset.part) - Number(second.dataset.part); });
    }

    function allInputs() {
      return Array.from(document.querySelectorAll(".answer-input"));
    }

    function normalise(value) {
      return value.trim().toLowerCase();
    }

    function hideMessage() {
      message.textContent = "";
      message.classList.remove("show");
    }

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    function updateProgress() {
      const completed = answers.filter(function (answer) {
        return inputsFor(answer.id).every(function (input) { return normalise(input.value).length > 0; });
      }).length;
      document.getElementById("progressText").textContent = completed + "/" + answers.length + " answers completed";
    }

    function focusNextInput(currentInput) {
      const inputs = allInputs();
      const index = inputs.indexOf(currentInput);
      if (inputs[index + 1]) inputs[index + 1].focus();
    }

    function handlePaste(event, answerId, currentPart) {
      if (locked) return;
      const pastedWords = (event.clipboardData || window.clipboardData)
        .getData("text")
        .toLowerCase()
        .match(/[a-z]+/g);

      if (!pastedWords || pastedWords.length < 2) return;
      event.preventDefault();

      const group = inputsFor(answerId);
      pastedWords.slice(0, group.length - currentPart).forEach(function (word, offset) {
        const input = group[currentPart + offset];
        if (input) input.value = word.slice(0, input.maxLength);
      });
      updateProgress();
      const finalInput = group[Math.min(group.length - 1, currentPart + pastedWords.length - 1)];
      if (finalInput) finalInput.focus();
    }

    function renderEmail() {
      emailText.innerHTML = "";

      emailParts.forEach(function (part) {
        if (Object.prototype.hasOwnProperty.call(part, "text")) {
          emailText.appendChild(document.createTextNode(part.text));
          return;
        }

        const answer = answerMap.get(part.answer);
        const expectedWord = answer.words[part.part];
        const input = document.createElement("input");
        input.type = "text";
        input.className = "answer-input";
        input.dataset.answer = part.answer;
        input.dataset.part = String(part.part);
        input.maxLength = Math.max(expectedWord.length + 3, 12);
        input.autocomplete = "off";
        input.spellcheck = false;
        input.inputMode = "text";
        input.style.setProperty("--letters", String(Math.max(expectedWord.length, 4)));
        input.setAttribute("aria-label", "Answer " + answer.number + ", word " + (part.part + 1) + " of 2");

        input.addEventListener("focus", function () {
          input.classList.remove("attention");
          hideMessage();
        });

        input.addEventListener("input", function () {
          if (locked) return;
          input.value = input.value.toLowerCase().replace(/[^a-z]/g, "");
          input.classList.remove("attention");
          inputsFor(part.answer).forEach(function (groupInput) { groupInput.classList.remove("wrong"); });
          updateProgress();
          /* Keep focus in the box until the student chooses to move on.
             Automatic focus changes made editing difficult on phones. */
        });

        input.addEventListener("paste", function (event) {
          handlePaste(event, part.answer, part.part);
        });

        emailText.appendChild(input);
      });
    }

    function dateTime() {
      try {
        return new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      } catch (error) {
        return new Date().toLocaleString();
      }
    }

    function renderReview(results) {
      reviewList.innerHTML = "";

      answers.forEach(function (answer, index) {
        const result = results[index];
        const item = document.createElement("li");
        item.className = "review-item" + (result.correct ? "" : " was-wrong");
        item.textContent = (result.correct ? "✓ " : "✕ ") + (index + 1) + ". " + answer.words.join(" ") + " (" + answer.base + ")";

        if (!result.correct) {
          const detail = document.createElement("small");
          detail.textContent = "Your answer: " + (result.entered.join(" ") || "—");
          item.appendChild(detail);
        }

        reviewList.appendChild(item);
      });

      answerReview.classList.add("show");
    }

    function checkAnswers() {
      if (locked) return;

      const firstEmpty = allInputs().find(function (input) { return normalise(input.value).length === 0; });
      if (firstEmpty) {
        showMessage("Complete every blank before checking your answers.");
        firstEmpty.classList.add("attention");
        firstEmpty.focus();
        return;
      }

      hideMessage();
      const results = answers.map(function (answer) {
        const inputs = inputsFor(answer.id);
        const entered = inputs.map(function (input) { return normalise(input.value); });
        const correct = entered.every(function (word, index) { return word === answer.words[index]; });

        inputs.forEach(function (input, index) {
          input.disabled = correct;
          if (!correct) input.value = "";
          input.classList.remove("correct", "wrong");
          input.classList.add(correct ? "correct" : "wrong");
        });

        return { correct: correct, entered: entered };
      });

      const score = results.filter(function (result) { return result.correct; }).length;
      const perfect = score === answers.length;
      const percent = Math.round(score / answers.length * 100);
      locked = perfect;
      studentName.disabled = perfect;

      document.getElementById("percentage").textContent = percent + "%";
      document.getElementById("fraction").textContent = score + "/" + answers.length;
      resultPanel.className = "result show " + (perfect ? "success" : "failure");
      const mistakes = answers.length - score;
      document.getElementById("resultTitle").textContent = perfect ? "Completed successfully" : mistakes + " " + (mistakes === 1 ? "mistake" : "mistakes");
      document.getElementById("resultText").textContent = perfect
        ? "All 10 phrasal verbs are correct. Take a screenshot of this page and send it to your teacher."
        : "Correct answers stay green. Complete only the empty gaps, then check again. Incorrect answers and the answer key are not shown.";

      const name = studentName.value.trim();
      document.getElementById("resultMeta").textContent = (name ? name + " · " : "") + "Attempt " + attempt + " · " + dateTime();

      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      checkButton.classList.toggle("hidden", perfect);
      checkButton.textContent = perfect ? "✓ Check answers" : "✓ Check again";
      retryButton.className = perfect ? "action-button secondary" : "action-button secondary hidden";
      retryButton.textContent = "Start over";
      if (!perfect) {
        attempt += 1;
        document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      }
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetAttempt() {
      attempt += 1;
      locked = false;
      studentName.disabled = false;
      document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      resultPanel.className = "result";
      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      hideMessage();

      allInputs().forEach(function (input) {
        input.value = "";
        input.disabled = false;
        input.classList.remove("correct", "wrong", "attention");
      });

      checkButton.classList.remove("hidden");
      checkButton.textContent = "✓ Check answers";
      retryButton.className = "action-button secondary hidden";
      updateProgress();

      const firstInput = allInputs()[0];
      if (firstInput) firstInput.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      checkAnswers();
    });

    retryButton.addEventListener("click", resetAttempt);

    renderEmail();
    updateProgress();
  </script>
</body>
</html>
