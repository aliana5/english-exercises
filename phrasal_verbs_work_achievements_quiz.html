<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary: Phrasal verbs: work &amp; achievements (1)</title>
  <style>
    :root{--navy:#102a43;--blue:#1769aa;--orange:#ee5a00;--green:#168653;--red:#c23d30;--ink:#17212f;--muted:#667085;--line:#d5dfe7;--page:#edf3f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 7% 0%,#dff1ff 0,transparent 29rem),var(--page);font-family:Arial,Helvetica,sans-serif;line-height:1.5}button,input{font:inherit}
    .page{width:min(1120px,calc(100% - 28px));margin:28px auto;overflow:hidden;border-radius:23px;background:#fff;box-shadow:0 18px 50px rgba(16,42,67,.13)}
    header{padding:34px 48px 29px;color:#fff;background:linear-gradient(125deg,var(--navy),#174f73 70%,#187ca9)}.unit{margin:0 0 6px;color:#bceaff;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,45px);line-height:1.12}
    main{padding:30px 48px 44px}.intro{display:grid;grid-template-columns:1fr minmax(220px,290px);gap:22px;align-items:end}.instruction{margin:0 0 5px;color:var(--navy);font-size:clamp(21px,2.5vw,28px)}.hint{margin:0;color:var(--muted);font-size:15px}.name label{display:block;margin-bottom:6px;color:var(--navy);font-size:13px;font-weight:700}.name input{width:100%;min-height:46px;padding:9px 13px;border:1.5px solid #afbdc9;border-radius:10px}.name input:disabled{color:var(--ink);background:#f7f9fb;opacity:1}
    .toolbar{display:flex;justify-content:space-between;gap:15px;margin:22px 0 17px;padding:11px 15px;border:1px solid #d9e5ee;border-radius:11px;color:var(--navy);background:#f6fbff;font-size:14px;font-weight:700}.attempt{padding:5px 10px;border-radius:999px;color:var(--blue);background:#e7f3fc;white-space:nowrap}.message{display:none;margin:0 0 16px;padding:12px 15px;border-radius:10px;color:#932d22;background:#fff1ee;font-weight:700}.message.show{display:block}
    .items{display:grid;gap:12px}.item{display:grid;grid-template-columns:36px 1fr;gap:13px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff}.number{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;background:var(--navy);font-size:13px;font-weight:900}.sentence{font-size:19px}.answer{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 4px;border:1.5px solid #9caeba;border-radius:8px;overflow:hidden;background:#fff}.given{display:grid;place-items:center;min-width:34px;padding:7px 8px;color:var(--navy);background:#eef5fa;font-weight:900}.answer-input{width:var(--width,90px);min-width:68px;padding:7px 9px;border:0;border-left:1px solid #c3d0d9;outline:0;font-weight:800}.answer:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,170,.12)}.item.correct{border-color:#4dac7b;background:#f8fffb}.item.wrong{border-color:#dc7467;background:#fff9f7}.item.correct .number{background:var(--green)}.item.wrong .number{background:var(--red)}.item.correct .answer{border-color:var(--green)}.item.wrong .answer{border-color:var(--red)}
    .result{display:none;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:0 0 20px;padding:20px 22px;border:2px solid;border-radius:15px}.result.show{display:grid}.result.success{border-color:#38a36d;background:#eaf8f1}.result.failure{border-color:#e78776;background:#fff1ee}.score{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;color:#fff;background:var(--red);text-align:center}.success .score{background:var(--green)}.percent{display:block;font-size:29px;line-height:1;font-weight:900}.fraction{display:block;margin-top:5px;font-size:14px;font-weight:800}.result h2{margin:0 0 4px;color:var(--navy)}.result p{margin:4px 0}.meta{color:var(--muted);font-size:13px;font-weight:700}.review{display:none;margin-top:18px;padding:19px;border:1px solid #d7e2ea;border-radius:14px;background:#f8fbfd}.review.show{display:block}.review h3{margin:0 0 10px;color:var(--navy)}.review li{margin:7px 0}.review li.wrong{color:var(--red)}.review small{display:block;color:var(--muted)}
    .actions{display:flex;justify-content:flex-end;gap:11px;margin-top:22px}.action{min-height:48px;padding:11px 19px;border:0;border-radius:10px;cursor:pointer;font-weight:900}.primary{color:#fff;background:var(--orange)}.secondary{color:var(--blue);background:#e8f3fc}.hidden{display:none!important}
    @media(max-width:700px){.page{width:min(100% - 16px,1120px);margin:8px auto;border-radius:15px}header{padding:25px 20px}main{padding:23px 18px 31px}.intro{grid-template-columns:1fr}.item{grid-template-columns:30px 1fr;padding:13px 10px;gap:9px}.number{width:30px;height:30px}.sentence{font-size:17px}.answer-input{min-width:54px}.result{grid-template-columns:1fr;text-align:center}.score{margin:auto}.actions{display:grid}.action{width:100%}}
    @media print{body{background:#fff}.page{width:100%;margin:0;box-shadow:none}.actions,.hint{display:none!important}}
  </style>
</head>
<body>
  <article class="page">
    <header><p class="unit">STUDIO Advanced | Unit 5A</p><h1>Vocabulary: Phrasal verbs: work &amp; achievements (1)</h1></header>
    <main>
      <section class="intro">
        <div><h2 class="instruction">Complete the definitions with the missing letters.</h2><p class="hint">The first letter is provided. Type only the remaining letters.</p></div>
        <div class="name"><label for="studentName">Student name (for the final screenshot)</label><input id="studentName" type="text" maxlength="60" placeholder="Enter your name" autocomplete="name"></div>
      </section>
      <div class="toolbar"><span id="progress">0/10 answers completed</span><span class="attempt" id="attempt">Attempt 1</span></div>
      <div class="message" id="message" role="alert"></div>
      <section class="result" id="result" aria-live="polite"><div class="score"><div><span class="percent" id="percent">0%</span><span class="fraction" id="fraction">0/10</span></div></div><div><h2 id="resultTitle"></h2><p id="resultText"></p><p class="meta" id="resultMeta"></p></div></section>
      <form id="quiz" novalidate>
        <div class="items" id="items"></div>
        <section class="review" id="review"><h3>Correct answers</h3><ol id="reviewList"></ol></section>
        <div class="actions"><button class="action primary" id="check" type="submit">✓ Check answers</button><button class="action secondary hidden" id="retry" type="button">Try again</button></div>
      </form>
    </main>
  </article>
  <script>
    const questions = [
      {first:"t", missing:"ake", full:"take on", before:"If you ", after:" someone on, you give them a job."},
      {first:"s", missing:"ingle", full:"single out", before:"If you ", after:" someone out in a group, you give them extra attention."},
      {first:"s", missing:"hrug", full:"shrug off", before:"If you ", after:" off a problem, you show that it doesn't matter to you."},
      {first:"h", missing:"olds", full:"hold back", before:"If something ", after:" you back, it stops you advancing."},
      {first:"p", missing:"lay", full:"play down", before:"If you ", after:" down an achievement or problem, you give it less importance than others do."},
      {first:"p", missing:"ut", full:"put down to", before:"If you ", after:" one thing down to another, you say that the other thing caused it."},
      {first:"p", missing:"ore", full:"pore over", before:"If you ", after:" over something, you study it in great detail."},
      {first:"g", missing:"rapple", full:"grapple with", before:"If you ", after:" with something, you try hard to make sense of it."},
      {first:"w", missing:"alk", full:"walk away with", before:"If you ", after:" away with something, you win it easily or take it without asking."},
      {first:"p", missing:"ays", full:"pay off", before:"If hard work ", after:" off, it produces the outcome you'd hoped for."}
    ];
    const items=document.getElementById("items"),form=document.getElementById("quiz"),message=document.getElementById("message"),result=document.getElementById("result"),review=document.getElementById("review"),reviewList=document.getElementById("reviewList"),studentName=document.getElementById("studentName"),check=document.getElementById("check"),retry=document.getElementById("retry");
    let attempt=1,locked=false;
    const normalise=value=>value.trim().toLowerCase().replace(/[^a-z]/g,"");
    function inputs(){return Array.from(document.querySelectorAll(".answer-input"))}
    function updateProgress(){document.getElementById("progress").textContent=inputs().filter(input=>normalise(input.value)).length+"/"+questions.length+" answers completed"}
    function render(){items.innerHTML="";questions.forEach((q,index)=>{const row=document.createElement("div");row.className="item";row.dataset.index=String(index);const number=document.createElement("span");number.className="number";number.textContent=String(index+1);const sentence=document.createElement("div");sentence.className="sentence";sentence.append(document.createTextNode(q.before));const answer=document.createElement("span");answer.className="answer";const given=document.createElement("span");given.className="given";given.textContent=q.first;const input=document.createElement("input");input.className="answer-input";input.type="text";input.autocomplete="off";input.spellcheck=false;input.maxLength=q.missing.length+2;input.style.setProperty("--width",Math.max(68,q.missing.length*15)+"px");input.setAttribute("aria-label","Question "+(index+1)+", missing letters after "+q.first);input.addEventListener("input",()=>{if(locked)return;input.value=input.value.toLowerCase().replace(/[^a-z]/g,"");row.classList.remove("wrong");message.classList.remove("show");updateProgress()});answer.append(given,input);sentence.append(answer,document.createTextNode(q.after));row.append(number,sentence);items.appendChild(row)});updateProgress()}
    function dateTime(){try{return new Date().toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}catch(error){return new Date().toLocaleString()}}
    function checkAnswers(){if(locked)return;const fields=inputs();const empty=fields.find(input=>!normalise(input.value));if(empty){message.textContent="Complete all ten answers before checking.";message.classList.add("show");empty.focus();return}message.classList.remove("show");const results=questions.map((q,index)=>({entered:normalise(fields[index].value),correct:normalise(fields[index].value)===q.missing}));const score=results.filter(r=>r.correct).length,errors=questions.length-score,perfect=errors===0;locked=perfect;studentName.disabled=perfect;reviewList.innerHTML="";questions.forEach((q,index)=>{const row=document.querySelector('.item[data-index="'+index+'"]');row.classList.remove("correct","wrong");row.classList.add(results[index].correct?"correct":"wrong");fields[index].disabled=results[index].correct;if(!results[index].correct)fields[index].value=""});document.getElementById("percent").textContent=Math.round(score/questions.length*100)+"%";document.getElementById("fraction").textContent=score+"/"+questions.length;result.className="result show "+(perfect?"success":"failure");document.getElementById("resultTitle").textContent=perfect?"Completed successfully":errors+" "+(errors===1?"mistake":"mistakes");document.getElementById("resultText").textContent=perfect?"All 10 answers are correct. Take a screenshot and send it to your teacher.":"Correct answers stay green. Complete only the empty gaps, then check again. Incorrect answers and the answer key are not shown.";const name=studentName.value.trim();document.getElementById("resultMeta").textContent=(name?name+" · ":"")+"Attempt "+attempt+" · "+dateTime();review.classList.remove("show");check.classList.toggle("hidden",perfect);check.textContent=perfect?"✓ Check answers":"✓ Check again";retry.className=perfect?"action secondary":"action secondary hidden";retry.textContent="Start over";if(!perfect){attempt+=1;document.getElementById("attempt").textContent="Attempt "+attempt}result.scrollIntoView({behavior:"smooth",block:"start"})}
    function reset(){attempt+=1;locked=false;studentName.disabled=false;document.getElementById("attempt").textContent="Attempt "+attempt;result.className="result";review.classList.remove("show");reviewList.innerHTML="";check.classList.remove("hidden");check.textContent="✓ Check answers";retry.className="action secondary hidden";message.classList.remove("show");render();window.scrollTo({top:0,behavior:"smooth"})}
    form.addEventListener("submit",event=>{event.preventDefault();checkAnswers()});retry.addEventListener("click",reset);render();
  </script>
</body>
</html>
