<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Maker: Prefixes under- and over-</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #174f73;
      --blue: #1769aa;
      --orange: #ee5a00;
      --orange-dark: #c94c00;
      --green: #168653;
      --green-soft: #eaf8f1;
      --red: #c23d30;
      --red-soft: #fff1ee;
      --ink: #17212f;
      --muted: #667085;
      --line: #d6e0e8;
      --page: #edf3f8;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(16,42,67,.13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, #dff1ff 0, transparent 29rem),
        var(--page);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    .page {
      width: min(1140px, calc(100% - 30px));
      margin: 28px auto;
      overflow: hidden;
      border-radius: 23px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .header {
      position: relative;
      padding: 36px 52px 31px;
      overflow: hidden;
      color: var(--white);
      background: linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 70%, #187ca9 100%);
    }

    .header::after {
      content: "";
      position: absolute;
      top: -105px;
      right: -55px;
      width: 300px;
      height: 300px;
      border: 42px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }

    .unit {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: #bceaff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(30px, 4vw, 47px);
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    h1 em { font-weight: inherit; }

    .content { padding: 32px 52px 46px; }

    .intro {
      display: grid;
      grid-template-columns: 1fr minmax(230px, 290px);
      gap: 22px;
      align-items: end;
    }

    .instruction {
      margin: 0 0 5px;
      color: var(--navy);
      font-size: clamp(21px, 2.5vw, 28px);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .name-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .name-field input {
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 1.5px solid #afbdc9;
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .name-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.12);
    }

    .name-field input:disabled {
      color: var(--ink);
      background: #f7f9fb;
      opacity: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 0 17px;
      padding: 11px 15px;
      border: 1px solid #d9e5ee;
      border-radius: 11px;
      color: var(--navy);
      background: #f6fbff;
      font-size: 14px;
      font-weight: 700;
    }

    .attempt {
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e7f3fc;
      white-space: nowrap;
    }

    .message {
      display: none;
      margin: 0 0 17px;
      padding: 12px 15px;
      border-radius: 10px;
      color: #932d22;
      background: var(--red-soft);
      font-weight: 700;
    }

    .message.show { display: block; }

    .sentence-list {
      display: grid;
      gap: 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sentence-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 13px;
      align-items: center;
      min-height: 76px;
      padding: 16px 18px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .sentence-number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      font-size: 14px;
      font-weight: 800;
    }

    .sentence {
      color: #111827;
      font-size: clamp(18px, 1.8vw, 21px);
      line-height: 1.95;
    }

    .word-builder {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 3px 7px;
      vertical-align: middle;
      white-space: nowrap;
      line-height: 1.2;
    }

    .prefix-select {
      flex: 0 0 142px;
      width: 142px;
      height: 46px;
      padding: 6px 38px 6px 12px;
      border: 1.6px solid #87939f;
      border-radius: 8px;
      color: #111827;
      background: #fff;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      outline: none;
      cursor: pointer;
    }

    .prefix-select:focus {
      position: relative;
      z-index: 1;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.14);
    }

    .prefix-select.attention {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(194,61,48,.12);
    }

    .word-root {
      display: inline-flex;
      align-items: center;
      height: 46px;
      padding: 0 12px;
      border: 1.6px solid #c2ccd4;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 700;
      line-height: 1.2;
    }

    .word-builder.correct .prefix-select,
    .word-builder.correct .word-root {
      border-color: #4dac7b;
      color: #11643d;
      background: #f2fcf7;
    }

    .word-builder.wrong .prefix-select,
    .word-builder.wrong .word-root {
      border-color: #dc7467;
      color: #a12e23;
      background: #fff8f6;
    }

    .prefix-select:disabled {
      opacity: 1;
      cursor: default;
      -webkit-text-fill-color: currentColor;
    }

    .result {
      display: none;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 0 0 20px;
      padding: 21px 23px;
      border: 2px solid;
      border-radius: 15px;
    }

    .result.show { display: grid; }
    .result.success { border-color: #38a36d; background: linear-gradient(135deg, #e8f8ef, #f9fffb); }
    .result.failure { border-color: #e78776; background: linear-gradient(135deg, #fff0ec, #fffaf8); }

    .score {
      display: grid;
      place-items: center;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.18);
      text-align: center;
    }

    .success .score { background: var(--green); }
    .failure .score { background: var(--red); }
    .percentage { display: block; font-size: 29px; line-height: 1; font-weight: 900; }
    .fraction { display: block; margin-top: 5px; font-size: 14px; font-weight: 800; }
    .result-title { margin: 0 0 4px; color: var(--navy); font-size: 25px; }
    .result-text { margin: 0; font-size: 16px; }
    .result-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    .answer-review {
      display: none;
      margin-top: 19px;
      padding: 20px;
      border: 1px solid #d7e2ea;
      border-radius: 14px;
      background: #f8fbfd;
    }

    .answer-review.show { display: block; }
    .answer-review h3 { margin: 0 0 13px; color: var(--navy); font-size: 19px; }

    .review-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .review-item {
      padding: 10px 12px;
      border-radius: 9px;
      color: #12653f;
      background: var(--green-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .review-item.was-wrong { color: #982d23; background: var(--red-soft); }
    .review-item small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 700; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 11px;
      margin-top: 23px;
    }

    .action-button {
      min-height: 48px;
      padding: 11px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease;
    }

    .action-button:hover { transform: translateY(-1px); }
    .action-button:focus-visible { outline: 4px solid rgba(23,105,170,.25); outline-offset: 2px; }
    .primary { color: #fff; background: var(--orange); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: var(--navy); background: #e7eef4; }
    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .page { width: min(100% - 18px, 1140px); margin: 9px auto; border-radius: 15px; }
      .header, .content { padding-left: 21px; padding-right: 21px; }
      .header { padding-top: 28px; }
      .intro { grid-template-columns: 1fr; }
      .sentence-row { grid-template-columns: 32px minmax(0, 1fr); padding: 13px 10px; gap: 9px; }
      .sentence { line-height: 2.2; }
      .word-builder { gap: 5px; margin-left: 4px; margin-right: 4px; }
      .prefix-select { flex-basis: 120px; width: 120px; font-size: 16px; }
      .word-root { padding-left: 9px; padding-right: 9px; }
      .review-list { grid-template-columns: 1fr; }
      .result.show { grid-template-columns: 1fr; text-align: center; }
      .score { margin: 0 auto; }
      .actions { justify-content: stretch; }
      .action-button { flex: 1; }
    }

    @media (max-width: 520px) {
      .sentence-row {
        position: relative;
        display: block;
        min-height: 110px;
        padding: 57px 13px 17px;
      }

      .sentence-number {
        position: absolute;
        top: 14px;
        left: 13px;
        width: 31px;
        height: 31px;
      }

      .sentence { line-height: 2.35; }
      .prefix-select { flex-basis: 116px; width: 116px; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .actions, .hint { display: none !important; }
      .sentence-row, .answer-review { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="unit" id="unitLabel"></p>
      <h1>Word Maker: Prefixes <em>under-</em> and <em>over-</em></h1>
    </header>

    <section class="content">
      <div class="intro">
        <div>
          <h2 class="instruction" id="instruction"></h2>
          <p class="hint">Open each list and choose one of the two prefixes: <strong>under</strong> or <strong>over</strong>.</p>
        </div>
        <div class="name-field">
          <label for="studentName">Student name (for the final screenshot)</label>
          <input id="studentName" type="text" maxlength="60" placeholder="Enter your name" autocomplete="name">
        </div>
      </div>

      <div class="toolbar">
        <span id="progressText">0/7 answers completed</span>
        <span class="attempt" id="attemptBadge">Attempt 1</span>
      </div>

      <div class="message" id="message" role="alert"></div>

      <section class="result" id="resultPanel" aria-live="polite">
        <div class="score">
          <div>
            <span class="percentage" id="percentage">0%</span>
            <span class="fraction" id="fraction">0/7</span>
          </div>
        </div>
        <div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-text" id="resultText"></p>
          <p class="result-meta" id="resultMeta"></p>
        </div>
      </section>

      <form id="quizForm" novalidate>
        <ol class="sentence-list" id="sentenceList"></ol>

        <section class="answer-review" id="answerReview" aria-live="polite">
          <h3>Correct answers</h3>
          <ol class="review-list" id="reviewList"></ol>
        </section>

        <div class="actions">
          <button class="action-button primary" id="checkButton" type="submit">✓ Check answers</button>
          <button class="action-button secondary hidden" id="retryButton" type="button">Try again</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /* ===========================================================
       TEACHER EDITING AREA
       prefix must be either "under" or "over".
       The sentence arrays control where each word appears.
       =========================================================== */
    const settings = {
      unit: "STUDIO Advanced | Unit 5A",
      instruction: "Choose the correct prefix to complete the words."
    };

    const answers = [
      { id: "rated", prefix: "over", root: "rated", word: "overrated" },
      { id: "estimate", prefix: "under", root: "estimate", word: "underestimate" },
      { id: "valued", prefix: "under", root: "valued", word: "undervalued" },
      { id: "worked", prefix: "over", root: "worked", word: "overworked" },
      { id: "paid", prefix: "over", root: "paid", word: "overpaid" },
      { id: "represented", prefix: "under", root: "represented", word: "underrepresented" },
      { id: "achieving", prefix: "over", root: "achieving", word: "overachieving" }
    ];

    const sentences = [
      [{ text: "Holidays are " }, { gap: "rated" }, { text: ". I prefer working!" }],
      [{ text: "Never " }, { gap: "estimate" }, { text: " how long a job will take. Things always take longer than you expect." }],
      [{ text: "If you feel " }, { gap: "valued" }, { text: " at work, you should ask for a raise." }],
      [{ text: "People often complain about being " }, { gap: "worked" }, { text: ", but few people think they're " }, { gap: "paid" }, { text: " for what they do." }],
      [{ text: "Women are still " }, { gap: "represented" }, { text: " in many jobs, especially at senior level." }],
      [{ text: "Managers have to ensure that " }, { gap: "achieving" }, { text: " staff don't turn into workaholics." }]
    ];

    const answerMap = new Map(answers.map(function (answer, index) {
      return [answer.id, Object.assign({ number: index + 1 }, answer)];
    }));

    const sentenceList = document.getElementById("sentenceList");
    const form = document.getElementById("quizForm");
    const studentName = document.getElementById("studentName");
    const message = document.getElementById("message");
    const resultPanel = document.getElementById("resultPanel");
    const answerReview = document.getElementById("answerReview");
    const reviewList = document.getElementById("reviewList");
    const checkButton = document.getElementById("checkButton");
    const retryButton = document.getElementById("retryButton");

    let attempt = 1;
    let locked = false;

    document.getElementById("unitLabel").textContent = settings.unit;
    document.getElementById("instruction").textContent = settings.instruction;

    function allSelects() {
      return Array.from(document.querySelectorAll(".prefix-select"));
    }

    function selectFor(answerId) {
      return document.querySelector('.prefix-select[data-answer="' + answerId + '"]');
    }

    function hideMessage() {
      message.textContent = "";
      message.classList.remove("show");
    }

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    function updateProgress() {
      const completed = allSelects().filter(function (select) { return Boolean(select.value); }).length;
      document.getElementById("progressText").textContent = completed + "/" + answers.length + " answers completed";
    }

    function makeWordBuilder(answerId) {
      const answer = answerMap.get(answerId);
      const wrapper = document.createElement("span");
      wrapper.className = "word-builder";
      wrapper.dataset.answer = answerId;

      const select = document.createElement("select");
      select.className = "prefix-select";
      select.dataset.answer = answerId;
      select.setAttribute("aria-label", "Answer " + answer.number + ": choose under or over before " + answer.root);

      [
        { value: "", text: "Choose", disabled: true },
        { value: "under", text: "under" },
        { value: "over", text: "over" }
      ].forEach(function (choice) {
        const option = document.createElement("option");
        option.value = choice.value;
        option.textContent = choice.text;
        option.disabled = Boolean(choice.disabled);
        if (!choice.value) option.selected = true;
        select.appendChild(option);
      });

      select.addEventListener("focus", function () {
        select.classList.remove("attention");
        hideMessage();
      });

      select.addEventListener("change", function () {
        if (locked) return;
        select.classList.remove("attention");
        wrapper.classList.remove("wrong");
        updateProgress();
      });

      const root = document.createElement("span");
      root.className = "word-root";
      root.textContent = answer.root;

      wrapper.appendChild(select);
      wrapper.appendChild(root);
      return wrapper;
    }

    function renderSentences() {
      sentenceList.innerHTML = "";

      sentences.forEach(function (parts, sentenceIndex) {
        const row = document.createElement("li");
        row.className = "sentence-row";

        const number = document.createElement("span");
        number.className = "sentence-number";
        number.textContent = String(sentenceIndex + 1);

        const sentence = document.createElement("div");
        sentence.className = "sentence";

        parts.forEach(function (part) {
          if (Object.prototype.hasOwnProperty.call(part, "text")) {
            sentence.appendChild(document.createTextNode(part.text));
          } else {
            sentence.appendChild(makeWordBuilder(part.gap));
          }
        });

        row.appendChild(number);
        row.appendChild(sentence);
        sentenceList.appendChild(row);
      });
    }

    function dateTime() {
      try {
        return new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      } catch (error) {
        return new Date().toLocaleString();
      }
    }

    function renderReview(results) {
      reviewList.innerHTML = "";

      answers.forEach(function (answer, index) {
        const result = results[index];
        const item = document.createElement("li");
        item.className = "review-item" + (result.correct ? "" : " was-wrong");
        item.textContent = (result.correct ? "✓ " : "✕ ") + (index + 1) + ". " + answer.prefix + " + " + answer.root + " = " + answer.word;

        if (!result.correct) {
          const detail = document.createElement("small");
          detail.textContent = "Your choice: " + result.entered;
          item.appendChild(detail);
        }

        reviewList.appendChild(item);
      });

      answerReview.classList.add("show");
    }

    function checkAnswers() {
      if (locked) return;

      const firstEmpty = allSelects().find(function (select) { return !select.value; });
      if (firstEmpty) {
        showMessage("Choose under or over in every gap before checking your answers.");
        firstEmpty.classList.add("attention");
        firstEmpty.focus();
        return;
      }

      hideMessage();
      const results = answers.map(function (answer) {
        const select = selectFor(answer.id);
        const wrapper = select.closest(".word-builder");
        const entered = select.value;
        const correct = entered === answer.prefix;

        select.disabled = correct;
        if (!correct) select.value = "";
        wrapper.classList.remove("correct", "wrong");
        wrapper.classList.add(correct ? "correct" : "wrong");

        return { correct: correct, entered: entered };
      });

      const score = results.filter(function (result) { return result.correct; }).length;
      const perfect = score === answers.length;
      const percent = Math.round(score / answers.length * 100);
      locked = perfect;
      studentName.disabled = perfect;

      document.getElementById("percentage").textContent = percent + "%";
      document.getElementById("fraction").textContent = score + "/" + answers.length;
      resultPanel.className = "result show " + (perfect ? "success" : "failure");
      const mistakes = answers.length - score;
      document.getElementById("resultTitle").textContent = perfect ? "Completed successfully" : mistakes + " " + (mistakes === 1 ? "mistake" : "mistakes");
      document.getElementById("resultText").textContent = perfect
        ? "All 7 prefixes are correct. Take a screenshot of this page and send it to your teacher."
        : "Correct answers stay green. Complete only the empty gaps, then check again. Incorrect answers and the answer key are not shown.";

      const name = studentName.value.trim();
      document.getElementById("resultMeta").textContent = (name ? name + " · " : "") + "Attempt " + attempt + " · " + dateTime();

      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      checkButton.classList.toggle("hidden", perfect);
      checkButton.textContent = perfect ? "✓ Check answers" : "✓ Check again";
      retryButton.className = perfect ? "action-button secondary" : "action-button secondary hidden";
      retryButton.textContent = "Start over";
      if (!perfect) {
        attempt += 1;
        document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      }
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetAttempt() {
      attempt += 1;
      locked = false;
      studentName.disabled = false;
      document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      resultPanel.className = "result";
      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      hideMessage();

      allSelects().forEach(function (select) {
        select.value = "";
        select.disabled = false;
        select.classList.remove("attention");
        select.closest(".word-builder").classList.remove("correct", "wrong");
      });

      checkButton.classList.remove("hidden");
      checkButton.textContent = "✓ Check answers";
      retryButton.className = "action-button secondary hidden";
      updateProgress();

      const firstSelect = allSelects()[0];
      if (firstSelect) firstSelect.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      checkAnswers();
    });

    retryButton.addEventListener("click", resetAttempt);

    renderSentences();
    updateProgress();
  </script>
</body>
</html>
