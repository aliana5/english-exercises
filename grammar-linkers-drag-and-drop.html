<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammar: Linkers of addition, contrast, reason &amp; result (2)</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #174f73;
      --blue: #1769aa;
      --blue-soft: #eaf5fd;
      --orange: #ee5a00;
      --orange-dark: #c94c00;
      --green: #168653;
      --green-soft: #eaf8f1;
      --red: #c23d30;
      --red-soft: #fff1ee;
      --ink: #17212f;
      --muted: #667085;
      --line: #d5dfe7;
      --page: #edf3f8;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(16, 42, 67, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, #dff1ff 0, transparent 29rem),
        var(--page);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 30px));
      margin: 28px auto;
      overflow: hidden;
      border-radius: 23px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .header {
      position: relative;
      padding: 36px 52px 31px;
      overflow: hidden;
      color: var(--white);
      background: linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 70%, #187ca9 100%);
    }

    .header::after {
      content: "";
      position: absolute;
      top: -105px;
      right: -55px;
      width: 300px;
      height: 300px;
      border: 42px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
    }

    .unit {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: #bceaff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0;
      font-size: clamp(29px, 4vw, 46px);
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    .content { padding: 32px 52px 46px; }

    .intro {
      display: grid;
      grid-template-columns: 1fr minmax(230px, 290px);
      gap: 22px;
      align-items: end;
    }

    .instruction {
      margin: 0 0 5px;
      color: var(--navy);
      font-size: clamp(21px, 2.5vw, 28px);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .name-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .name-field input {
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 1.5px solid #afbdc9;
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .name-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23, 105, 170, .12);
    }

    .name-field input:disabled {
      color: var(--ink);
      background: #f7f9fb;
      opacity: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 0 17px;
      padding: 11px 15px;
      border: 1px solid #d9e5ee;
      border-radius: 11px;
      color: var(--navy);
      background: #f6fbff;
      font-size: 14px;
      font-weight: 700;
    }

    .attempt {
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e7f3fc;
      white-space: nowrap;
    }

    .message {
      display: none;
      margin: 0 0 17px;
      padding: 12px 15px;
      border-radius: 10px;
      color: #932d22;
      background: var(--red-soft);
      font-weight: 700;
    }

    .message.show { display: block; }

    .bank-panel {
      margin-bottom: 22px;
      padding: 18px;
      border: 2px dashed #8db7d2;
      border-radius: 15px;
      background: linear-gradient(180deg, #f5fbff, #eef8fd);
      transition: border-color .15s ease, background .15s ease;
    }

    .bank-panel.drag-over {
      border-color: var(--orange);
      background: #fff6ed;
    }

    .bank-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 15px;
      margin-bottom: 13px;
    }

    .bank-heading h3 {
      margin: 0;
      color: var(--navy);
      font-size: 17px;
    }

    .bank-heading span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 50px;
      align-items: center;
    }

    .bank-empty {
      width: 100%;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .word-card {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 16px;
      border: 1.5px solid #67a894;
      border-radius: 10px;
      color: #103f32;
      background: #bfe7d7;
      box-shadow: 0 3px 0 rgba(28, 117, 88, .16);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      cursor: grab;
      user-select: none;
      touch-action: manipulation;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }

    .word-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 rgba(28, 117, 88, .16);
    }

    .word-card:active { cursor: grabbing; }

    .word-card:focus-visible {
      outline: 4px solid rgba(23, 105, 170, .24);
      outline-offset: 2px;
    }

    .word-card.selected {
      border-color: var(--orange);
      background: #fff1df;
      box-shadow: 0 0 0 4px rgba(238, 90, 0, .15);
      transform: translateY(-1px);
    }

    .word-card.dragging { opacity: .48; }

    .word-card.placed {
      width: 100%;
      min-height: 46px;
      padding: 8px 33px 8px 12px;
      border: 0;
      border-radius: 7px;
      box-shadow: none;
    }

    .remove-word {
      position: absolute;
      top: 50%;
      right: 5px;
      width: 26px;
      height: 26px;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      color: #285f50;
      background: rgba(255, 255, 255, .58);
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .remove-word:hover { color: #fff; background: var(--red); }

    .dialogue-card {
      padding: 26px 30px 28px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
    }

    .dialogue-label {
      display: inline-block;
      margin-bottom: 13px;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e8f3fc;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .dialogue-line {
      margin: 0 0 13px;
      color: #111827;
      font-size: clamp(17px, 1.85vw, 21px);
      line-height: 2.65;
    }

    .dialogue-line:last-child { margin-bottom: 0; }

    .speaker {
      display: inline-block;
      min-width: 70px;
      margin-right: 5px;
      color: var(--navy);
      font-weight: 900;
      line-height: 1.4;
    }

    .gap-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 184px;
      min-height: 48px;
      margin: 0 5px;
      border: 1.7px dashed #8799a8;
      border-radius: 8px;
      color: #697b89;
      background: #fff;
      vertical-align: middle;
      cursor: pointer;
      outline: none;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .gap-slot.wide { width: 198px; }

    .gap-slot:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23, 105, 170, .14);
    }

    .gap-slot.available {
      border-color: var(--orange);
      background: #fff8ef;
    }

    .gap-slot.drag-over {
      border-style: solid;
      border-color: var(--orange);
      background: #fff0df;
      box-shadow: 0 0 0 4px rgba(238, 90, 0, .13);
    }

    .gap-slot.attention {
      border-color: var(--red);
      background: var(--red-soft);
      box-shadow: 0 0 0 4px rgba(194, 61, 48, .11);
    }

    .gap-number {
      position: absolute;
      top: -9px;
      left: -7px;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
    }

    .gap-placeholder {
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      pointer-events: none;
    }

    .gap-slot.was-correct {
      border-style: solid;
      border-color: #4dac7b;
      background: #f2fcf7;
    }

    .gap-slot.was-wrong {
      border-style: solid;
      border-color: #dc7467;
      background: #fff8f6;
    }

    .gap-slot.was-correct .gap-number { background: var(--green); }
    .gap-slot.was-wrong .gap-number { background: var(--red); }

    .gap-slot.locked { cursor: default; }
    .gap-slot.locked .word-card { cursor: default; pointer-events: none; }
    .gap-slot.locked .remove-word { display: none; }

    .selection-note {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--blue);
      font-size: 14px;
      font-weight: 800;
    }

    .result {
      display: none;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 0 0 20px;
      padding: 21px 23px;
      border: 2px solid;
      border-radius: 15px;
    }

    .result.show { display: grid; }
    .result.success { border-color: #38a36d; background: linear-gradient(135deg, #e8f8ef, #f9fffb); }
    .result.failure { border-color: #e78776; background: linear-gradient(135deg, #fff0ec, #fffaf8); }

    .score {
      display: grid;
      place-items: center;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      box-shadow: inset 0 0 0 7px rgba(255, 255, 255, .18);
      text-align: center;
    }

    .success .score { background: var(--green); }
    .failure .score { background: var(--red); }
    .percentage { display: block; font-size: 29px; line-height: 1; font-weight: 900; }
    .fraction { display: block; margin-top: 5px; font-size: 14px; font-weight: 800; }
    .result-title { margin: 0 0 4px; color: var(--navy); font-size: 25px; }
    .result-text { margin: 0; font-size: 16px; }
    .result-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    .answer-review {
      display: none;
      margin-top: 19px;
      padding: 20px;
      border: 1px solid #d7e2ea;
      border-radius: 14px;
      background: #f8fbfd;
    }

    .answer-review.show { display: block; }
    .answer-review h3 { margin: 0 0 13px; color: var(--navy); font-size: 19px; }

    .review-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 13px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .review-item {
      padding: 10px 12px;
      border-radius: 9px;
      color: #12653f;
      background: var(--green-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .review-item.was-wrong { color: #982d23; background: var(--red-soft); }
    .review-item small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 700; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 11px;
      margin-top: 23px;
    }

    .action-button {
      min-height: 48px;
      padding: 11px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease;
    }

    .action-button:hover { transform: translateY(-1px); }
    .action-button:focus-visible { outline: 4px solid rgba(23, 105, 170, .25); outline-offset: 2px; }
    .primary { color: #fff; background: var(--orange); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: var(--navy); background: #e7eef4; }
    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .page { width: min(100% - 18px, 1180px); margin: 9px auto; border-radius: 15px; }
      .header, .content { padding-left: 20px; padding-right: 20px; }
      .header { padding-top: 28px; }
      .intro { grid-template-columns: 1fr; }
      .bank-heading { display: block; }
      .bank-heading span { display: block; margin-top: 3px; text-align: left; }
      .word-card { min-height: 48px; padding-left: 14px; padding-right: 14px; }
      .dialogue-card { padding: 22px 15px 25px; }
      .dialogue-line { line-height: 2.85; }
      .speaker { min-width: 62px; }
      .gap-slot, .gap-slot.wide { width: min(168px, 48vw); }
      .review-list { grid-template-columns: 1fr; }
      .result.show { grid-template-columns: 1fr; text-align: center; }
      .score { margin: 0 auto; }
      .actions { justify-content: stretch; }
      .action-button { flex: 1; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .actions, .hint, .selection-note { display: none !important; }
      .dialogue-card, .answer-review, .result { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="unit" id="unitLabel"></p>
      <h1 id="quizTitle"></h1>
    </header>

    <section class="content">
      <div class="intro">
        <div>
          <h2 class="instruction" id="instruction"></h2>
          <p class="hint">Drag each card into a gap. If dragging does not work, tap a card once and then tap the numbered gap.</p>
        </div>
        <div class="name-field">
          <label for="studentName">Student name (for the final screenshot)</label>
          <input id="studentName" type="text" maxlength="60" placeholder="Enter your name" autocomplete="name">
        </div>
      </div>

      <div class="toolbar">
        <span id="progressText">0/8 gaps completed</span>
        <span class="attempt" id="attemptBadge">Attempt 1</span>
      </div>

      <div class="message" id="message" role="alert"></div>

      <section class="result" id="resultPanel" aria-live="polite">
        <div class="score">
          <div>
            <span class="percentage" id="percentage">0%</span>
            <span class="fraction" id="fraction">0/8</span>
          </div>
        </div>
        <div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-text" id="resultText"></p>
          <p class="result-meta" id="resultMeta"></p>
        </div>
      </section>

      <form id="quizForm" novalidate>
        <section class="bank-panel" id="bankPanel" aria-label="Word box">
          <div class="bank-heading">
            <h3>Words to use</h3>
            <span>Tap a card → tap a numbered gap · each card is used once</span>
          </div>
          <div class="word-bank" id="wordBank"></div>
          <p class="selection-note" id="selectionNote" aria-live="polite"></p>
        </section>

        <article class="dialogue-card">
          <span class="dialogue-label">The interview</span>
          <div id="dialogue"></div>
        </article>

        <section class="answer-review" id="answerReview" aria-live="polite">
          <h3>Correct answers</h3>
          <ol class="review-list" id="reviewList"></ol>
        </section>

        <div class="actions">
          <button class="action-button primary" id="checkButton" type="submit">✓ Check answers</button>
          <button class="action-button secondary hidden" id="retryButton" type="button">Try again</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /* ===========================================================
       TEACHER EDITING AREA
       Edit the word cards, answer key, or conversation below.
       Every token id must be unique. Each gap answer uses a token id.
       =========================================================== */
    const settings = {
      title: "Grammar: Linkers of addition, contrast, reason & result (2)",
      unit: "STUDIO Advanced | Unit 5A",
      instruction: "Complete the conversation between two friends with these linkers."
    };

    const tokens = [
      { id: "as-well", text: "as well" },
      { id: "besides", text: "besides" },
      { id: "but", text: "but" },
      { id: "in-which-case", text: "in which case" },
      { id: "mind", text: "mind" },
      { id: "seeing-as", text: "seeing as" },
      { id: "then-again", text: "then again" },
      { id: "though", text: "though" }
    ];

    const gaps = [
      { id: "g1", answer: "though", review: "There were lots of other people there, though." },
      { id: "g2", answer: "besides", review: "And besides, I don't have that much experience." },
      { id: "g3", answer: "as-well", review: "She applied as well." },
      { id: "g4", answer: "then-again", review: "Then again, they were interviewing people all day." },
      { id: "g5", answer: "but", review: "But you think you've got a good chance?" },
      { id: "g6", answer: "seeing-as", review: "Seeing as I had all the right qualifications, I think so." },
      { id: "g7", answer: "in-which-case", review: "In which case, we should celebrate!", wide: true },
      { id: "g8", answer: "mind", review: "Mind you, it would be nice to go out ..." }
    ];

    const conversation = [
      { speaker: "Bray", parts: [{ text: "How did the interview go?" }] },
      { speaker: "Aja", parts: [
        { text: "It went ok. There were lots of other people there, " }, { gap: "g1" },
        { text: ". And " }, { gap: "g2" }, { text: ", I don't have that much experience." }
      ] },
      { speaker: "Bray", parts: [
        { text: "Did you see Vera? She applied " }, { gap: "g3" }, { text: "." }
      ] },
      { speaker: "Aja", parts: [
        { text: "No I didn't. " }, { gap: "g4" },
        { text: ", they were interviewing people all day. I could easily have missed her." }
      ] },
      { speaker: "Bray", parts: [
        { gap: "g5" }, { text: " you think you've got a good chance?" }
      ] },
      { speaker: "Aja", parts: [
        { gap: "g6" }, { text: " I had all the right qualifications, I think so." }
      ] },
      { speaker: "Bray", parts: [
        { gap: "g7" }, { text: ", we should celebrate!" }
      ] },
      { speaker: "Aja", parts: [
        { text: "Let's wait. I'll know by the end of the week. " }, { gap: "g8" },
        { text: " you, it would be nice to go out, so let's celebrate anyway." }
      ] }
    ];

    const tokenMap = new Map(tokens.map(function (token) { return [token.id, token]; }));
    const gapMap = new Map(gaps.map(function (gap, index) {
      return [gap.id, Object.assign({ number: index + 1 }, gap)];
    }));

    const placements = {};
    gaps.forEach(function (gap) { placements[gap.id] = null; });

    const form = document.getElementById("quizForm");
    const dialogue = document.getElementById("dialogue");
    const wordBank = document.getElementById("wordBank");
    const bankPanel = document.getElementById("bankPanel");
    const studentName = document.getElementById("studentName");
    const message = document.getElementById("message");
    const selectionNote = document.getElementById("selectionNote");
    const resultPanel = document.getElementById("resultPanel");
    const answerReview = document.getElementById("answerReview");
    const reviewList = document.getElementById("reviewList");
    const checkButton = document.getElementById("checkButton");
    const retryButton = document.getElementById("retryButton");

    let attempt = 1;
    let locked = false;
    let selectedTokenId = null;
    let draggedTokenId = null;
    let lastResults = null;

    document.title = settings.title;
    document.getElementById("quizTitle").textContent = settings.title;
    document.getElementById("unitLabel").textContent = settings.unit;
    document.getElementById("instruction").textContent = settings.instruction;

    function hideMessage() {
      message.textContent = "";
      message.classList.remove("show");
    }

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    function findGapForToken(tokenId) {
      return gaps.find(function (gap) { return placements[gap.id] === tokenId; }) || null;
    }

    function gapConfirmed(gapId) {
      if (!lastResults) return false;
      const index = gaps.findIndex(function (gap) { return gap.id === gapId; });
      return index >= 0 && lastResults[index].correct;
    }

    function displayText(tokenId, gapId) {
      const token = tokenMap.get(tokenId);
      if (!token) return "";
      const startsSentence = ["g4", "g5", "g6", "g7", "g8"].includes(gapId);
      return startsSentence ? token.text.charAt(0).toUpperCase() + token.text.slice(1) : token.text;
    }

    function setSelected(tokenId) {
      if (locked) return;
      selectedTokenId = selectedTokenId === tokenId ? null : tokenId;
      renderSelection();
    }

    function renderSelection() {
      document.querySelectorAll(".word-card").forEach(function (card) {
        const selected = card.dataset.tokenId === selectedTokenId;
        card.classList.toggle("selected", selected);
        card.setAttribute("aria-pressed", String(selected));
      });

      document.querySelectorAll(".gap-slot").forEach(function (slot) {
        slot.classList.toggle("available", Boolean(selectedTokenId) && !locked);
      });

      if (selectedTokenId) {
        selectionNote.textContent = "Selected: “" + tokenMap.get(selectedTokenId).text + "”. Now tap a gap.";
      } else if (!locked) {
        selectionNote.textContent = "Tip: tap a card, then tap a gap. Use × to return a placed card.";
      } else {
        selectionNote.textContent = "";
      }
    }

    function makeWordCard(tokenId, gapId) {
      const confirmed = Boolean(gapId && gapConfirmed(gapId));
      const card = document.createElement("span");
      card.className = "word-card" + (gapId ? " placed" : "");
      card.dataset.tokenId = tokenId;
      card.dataset.location = gapId || "bank";
      card.draggable = !locked && !confirmed;
      card.tabIndex = locked || confirmed ? -1 : 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-pressed", "false");
      card.setAttribute("aria-label", (gapId ? "Placed card " : "Word card ") + tokenMap.get(tokenId).text);

      const text = document.createElement("span");
      text.className = "word-text";
      text.textContent = gapId ? displayText(tokenId, gapId) : tokenMap.get(tokenId).text;
      card.appendChild(text);

      if (gapId && !locked && !confirmed) {
        const remove = document.createElement("button");
        remove.className = "remove-word";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Return " + tokenMap.get(tokenId).text + " to the word box");
        remove.addEventListener("click", function (event) {
          event.stopPropagation();
          returnToBank(tokenId);
        });
        card.appendChild(remove);
      }

      card.addEventListener("click", function (event) {
        if (locked || confirmed || event.target.closest(".remove-word")) return;
        const targetGap = card.dataset.location === "bank" ? null : card.dataset.location;
        if (selectedTokenId && selectedTokenId !== tokenId && targetGap) {
          placeToken(selectedTokenId, targetGap);
        } else {
          setSelected(tokenId);
        }
      });

      card.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          card.click();
        }
      });

      card.addEventListener("dragstart", function (event) {
        if (locked || confirmed) {
          event.preventDefault();
          return;
        }
        draggedTokenId = tokenId;
        card.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", tokenId);
      });

      card.addEventListener("dragend", function () {
        draggedTokenId = null;
        card.classList.remove("dragging");
        document.querySelectorAll(".drag-over").forEach(function (item) {
          item.classList.remove("drag-over");
        });
      });

      return card;
    }

    function makeGap(gapId) {
      const gap = gapMap.get(gapId);
      const confirmed = gapConfirmed(gapId);
      const slot = document.createElement("span");
      slot.className = "gap-slot" + (gap.wide ? " wide" : "");
      slot.dataset.gapId = gapId;
      slot.tabIndex = 0;
      slot.setAttribute("role", "button");
      slot.setAttribute("aria-label", "Gap " + gap.number + ". Empty.");

      const number = document.createElement("span");
      number.className = "gap-number";
      number.textContent = String(gap.number);
      number.setAttribute("aria-hidden", "true");
      slot.appendChild(number);

      slot.addEventListener("click", function (event) {
        if (locked || confirmed || event.target.closest(".word-card")) return;
        slot.classList.remove("attention");
        if (selectedTokenId) {
          placeToken(selectedTokenId, gapId);
        } else if (placements[gapId]) {
          setSelected(placements[gapId]);
        }
      });

      slot.addEventListener("keydown", function (event) {
        if ((event.key === "Enter" || event.key === " ") && selectedTokenId && !locked) {
          event.preventDefault();
          placeToken(selectedTokenId, gapId);
        }
      });

      slot.addEventListener("dragover", function (event) {
        if (locked || confirmed) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        slot.classList.add("drag-over");
      });

      slot.addEventListener("dragleave", function () { slot.classList.remove("drag-over"); });

      slot.addEventListener("drop", function (event) {
        if (locked || confirmed) return;
        event.preventDefault();
        slot.classList.remove("drag-over");
        const tokenId = event.dataTransfer.getData("text/plain") || draggedTokenId;
        if (tokenMap.has(tokenId)) placeToken(tokenId, gapId);
      });

      return slot;
    }

    function renderConversation() {
      dialogue.innerHTML = "";
      conversation.forEach(function (line) {
        const paragraph = document.createElement("p");
        paragraph.className = "dialogue-line";

        const speaker = document.createElement("strong");
        speaker.className = "speaker";
        speaker.textContent = line.speaker;
        paragraph.appendChild(speaker);

        line.parts.forEach(function (part) {
          if (Object.prototype.hasOwnProperty.call(part, "text")) {
            paragraph.appendChild(document.createTextNode(part.text));
          } else {
            paragraph.appendChild(makeGap(part.gap));
          }
        });

        dialogue.appendChild(paragraph);
      });
    }

    function renderBank() {
      wordBank.innerHTML = "";
      const used = new Set(Object.values(placements).filter(Boolean));
      const remaining = tokens.filter(function (token) { return !used.has(token.id); });

      if (!remaining.length) {
        const empty = document.createElement("div");
        empty.className = "bank-empty";
        empty.textContent = "All cards have been placed.";
        wordBank.appendChild(empty);
      } else {
        remaining.forEach(function (token) { wordBank.appendChild(makeWordCard(token.id, null)); });
      }
    }

    function updateGapContents() {
      gaps.forEach(function (gap) {
        const slot = document.querySelector('.gap-slot[data-gap-id="' + gap.id + '"]');
        if (!slot) return;

        Array.from(slot.children).forEach(function (child) {
          if (!child.classList.contains("gap-number")) child.remove();
        });

        const tokenId = placements[gap.id];
        if (tokenId) {
          slot.appendChild(makeWordCard(tokenId, gap.id));
          slot.setAttribute("aria-label", "Gap " + gap.number + ": " + displayText(tokenId, gap.id));
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "gap-placeholder";
          placeholder.textContent = "Tap / drop here";
          slot.appendChild(placeholder);
          slot.setAttribute("aria-label", "Gap " + gap.number + ". Empty.");
        }

        slot.classList.toggle("locked", locked || gapConfirmed(gap.id));
      });
    }

    function renderInteractive() {
      renderBank();
      updateGapContents();
      updateProgress();
      renderSelection();
    }

    function placeToken(tokenId, targetGapId) {
      if (locked || gapConfirmed(targetGapId) || !tokenMap.has(tokenId) || !gapMap.has(targetGapId)) return;
      hideMessage();
      document.querySelectorAll(".gap-slot.attention").forEach(function (slot) {
        slot.classList.remove("attention");
      });

      const sourceGap = findGapForToken(tokenId);
      if (sourceGap && gapConfirmed(sourceGap.id)) return;
      if (sourceGap && sourceGap.id === targetGapId) {
        selectedTokenId = null;
        renderSelection();
        return;
      }

      const displacedToken = placements[targetGapId];
      placements[targetGapId] = tokenId;
      if (sourceGap) placements[sourceGap.id] = displacedToken || null;

      selectedTokenId = null;
      renderInteractive();

      const target = document.querySelector('.gap-slot[data-gap-id="' + targetGapId + '"]');
      if (target) {
        target.classList.remove("was-wrong");
        target.focus({ preventScroll: true });
      }
    }

    function returnToBank(tokenId) {
      if (locked) return;
      const sourceGap = findGapForToken(tokenId);
      if (sourceGap && gapConfirmed(sourceGap.id)) return;
      if (sourceGap) placements[sourceGap.id] = null;
      if (selectedTokenId === tokenId) selectedTokenId = null;
      hideMessage();
      renderInteractive();
    }

    function updateProgress() {
      const completed = Object.values(placements).filter(Boolean).length;
      document.getElementById("progressText").textContent = completed + "/" + gaps.length + " gaps completed";
    }

    function dateTime() {
      try {
        return new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      } catch (error) {
        return new Date().toLocaleString();
      }
    }

    function renderReview(results) {
      reviewList.innerHTML = "";
      gaps.forEach(function (gap, index) {
        const result = results[index];
        const item = document.createElement("li");
        item.className = "review-item" + (result.correct ? "" : " was-wrong");
        item.textContent = (result.correct ? "✓ " : "✕ ") + (index + 1) + ". " + gap.review;

        const detail = document.createElement("small");
        detail.textContent = result.correct
          ? "Correct on this attempt."
          : "Your answer: “" + tokenMap.get(result.entered).text + "”. Correct answer: “" + tokenMap.get(gap.answer).text + "”.";
        item.appendChild(detail);
        reviewList.appendChild(item);
      });
      answerReview.classList.add("show");
    }

    function checkAnswers() {
      if (locked) return;

      const firstEmpty = gaps.find(function (gap) { return !placements[gap.id]; });
      if (firstEmpty) {
        showMessage("Place all eight cards before checking your answers.");
        const slot = document.querySelector('.gap-slot[data-gap-id="' + firstEmpty.id + '"]');
        if (slot) {
          slot.classList.add("attention");
          slot.focus();
        }
        return;
      }

      hideMessage();
      selectedTokenId = null;

      const results = gaps.map(function (gap) {
        return { entered: placements[gap.id], correct: placements[gap.id] === gap.answer };
      });
      lastResults = results;

      const score = results.filter(function (result) { return result.correct; }).length;
      const perfect = score === gaps.length;
      const percent = Math.round(score / gaps.length * 100);

      locked = perfect;
      studentName.disabled = perfect;
      gaps.forEach(function (gap, index) {
        if (!results[index].correct) placements[gap.id] = null;
      });
      renderInteractive();

      gaps.forEach(function (gap, index) {
        const slot = document.querySelector('.gap-slot[data-gap-id="' + gap.id + '"]');
        slot.classList.add(results[index].correct ? "was-correct" : "was-wrong");
      });

      document.getElementById("percentage").textContent = percent + "%";
      document.getElementById("fraction").textContent = score + "/" + gaps.length;
      resultPanel.className = "result show " + (perfect ? "success" : "failure");
      const mistakes = gaps.length - score;
      document.getElementById("resultTitle").textContent = perfect ? "Completed successfully" : mistakes + " " + (mistakes === 1 ? "mistake" : "mistakes");
      document.getElementById("resultText").textContent = perfect
        ? "All 8 answers are correct. Take a screenshot of this result and send it to your teacher."
        : "Correct cards stay green and locked. Place only the remaining cards, then check again. Incorrect answers and the answer key are not shown.";

      const name = studentName.value.trim();
      document.getElementById("resultMeta").textContent = (name ? name + " · " : "") + "Attempt " + attempt + " · " + dateTime();

      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      checkButton.classList.toggle("hidden", perfect);
      checkButton.textContent = perfect ? "✓ Check answers" : "✓ Check again";
      retryButton.className = perfect ? "action-button secondary" : "action-button secondary hidden";
      retryButton.textContent = "Start over";
      if (!perfect) {
        attempt += 1;
        document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      }
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetAttempt() {
      attempt += 1;
      locked = false;
      selectedTokenId = null;
      draggedTokenId = null;
      lastResults = null;
      studentName.disabled = false;
      gaps.forEach(function (gap) { placements[gap.id] = null; });

      document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      resultPanel.className = "result";
      answerReview.classList.remove("show");
      reviewList.innerHTML = "";
      hideMessage();

      document.querySelectorAll(".gap-slot").forEach(function (slot) {
        slot.classList.remove("was-correct", "was-wrong", "attention", "drag-over");
      });

      checkButton.classList.remove("hidden");
      checkButton.textContent = "✓ Check answers";
      retryButton.className = "action-button secondary hidden";
      renderInteractive();
      bankPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    bankPanel.addEventListener("dragover", function (event) {
      if (locked) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      bankPanel.classList.add("drag-over");
    });

    bankPanel.addEventListener("dragleave", function (event) {
      if (!bankPanel.contains(event.relatedTarget)) bankPanel.classList.remove("drag-over");
    });

    bankPanel.addEventListener("drop", function (event) {
      if (locked) return;
      event.preventDefault();
      bankPanel.classList.remove("drag-over");
      const tokenId = event.dataTransfer.getData("text/plain") || draggedTokenId;
      if (tokenMap.has(tokenId)) returnToBank(tokenId);
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      checkAnswers();
    });

    retryButton.addEventListener("click", resetAttempt);

    renderConversation();
    renderInteractive();
  </script>
</body>
</html>
