<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary: Phrasal verbs — Work &amp; Achievements (2)</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #174f73;
      --blue: #1769aa;
      --orange: #ee5a00;
      --orange-dark: #c94c00;
      --green: #15865a;
      --green-card: #b7e3d1;
      --green-card-hover: #a5dac5;
      --green-soft: #eaf8f1;
      --red: #bf3f32;
      --red-soft: #fff1ee;
      --ink: #17212f;
      --muted: #667085;
      --line: #d6e0e8;
      --page: #edf3f8;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(16, 42, 67, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, #dff1ff 0, transparent 29rem),
        var(--page);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    button, input { font: inherit; }

    .page {
      width: min(1160px, calc(100% - 30px));
      margin: 28px auto;
      overflow: hidden;
      border-radius: 23px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .header {
      position: relative;
      padding: 36px 52px 31px;
      overflow: hidden;
      color: var(--white);
      background: linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 70%, #187ca9 100%);
    }

    .header::after {
      content: "";
      position: absolute;
      top: -105px;
      right: -55px;
      width: 300px;
      height: 300px;
      border: 42px solid rgba(255,255,255,.08);
      border-radius: 50%;
    }

    .unit {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: #bceaff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0;
      font-size: clamp(30px, 4vw, 47px);
      line-height: 1.12;
      letter-spacing: -.025em;
    }

    .content { padding: 32px 52px 46px; }

    .intro {
      display: grid;
      grid-template-columns: 1fr minmax(230px, 290px);
      gap: 22px;
      align-items: end;
    }

    .instruction {
      margin: 0 0 5px;
      color: var(--navy);
      font-size: clamp(21px, 2.5vw, 28px);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .name-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    .name-field input {
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 1.5px solid #afbdc9;
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .name-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.12);
    }

    .name-field input:disabled {
      color: var(--ink);
      background: #f7f9fb;
      opacity: 1;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 0 17px;
      padding: 11px 15px;
      border: 1px solid #d9e5ee;
      border-radius: 11px;
      color: var(--navy);
      background: #f6fbff;
      font-size: 14px;
      font-weight: 700;
    }

    .attempt {
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--blue);
      background: #e7f3fc;
      white-space: nowrap;
    }

    .notice {
      min-height: 0;
      margin: 0 0 16px;
      padding: 0;
      border-radius: 10px;
      color: #765321;
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      transition: padding .2s ease, background .2s ease;
    }

    .notice.show {
      min-height: 44px;
      padding: 11px 14px;
      background: #fff7dd;
    }

    .rows {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .match-row {
      display: grid;
      grid-template-columns: 38px minmax(250px, .9fr) minmax(360px, 1.2fr);
      gap: 13px;
      align-items: center;
      min-height: 74px;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .match-row.drop-target {
      border-color: var(--orange);
      background: #fff9f4;
      transform: translateX(4px);
    }

    .match-row.correct {
      border-color: #65bb90;
      background: var(--green-soft);
    }

    .match-row.wrong {
      border-color: #e48c7f;
      background: var(--red-soft);
    }

    .number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      font-size: 14px;
      font-weight: 800;
    }

    .stem {
      padding-left: 4px;
      color: #111827;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 600;
      text-align: right;
    }

    .ending-card {
      position: relative;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      padding: 7px 8px 7px 10px;
      border: 2px solid transparent;
      border-radius: 10px;
      color: #113a2a;
      background: var(--green-card);
      cursor: grab;
      user-select: none;
      touch-action: manipulation;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .ending-card:hover { background: var(--green-card-hover); }

    .ending-card:focus-visible {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23,105,170,.16);
    }

    .ending-card.dragging {
      cursor: grabbing;
      opacity: .55;
      transform: scale(.985);
    }

    .ending-card.selected {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(238,90,0,.16);
      transform: translateX(-5px);
    }

    .ending-card.locked { cursor: default; }

    .drag-handle {
      display: grid;
      grid-template-columns: repeat(2, 4px);
      grid-template-rows: repeat(3, 4px);
      gap: 4px;
      justify-content: center;
      opacity: .62;
    }

    .drag-handle span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .ending-text {
      min-width: 0;
      color: #102f24;
      font-size: clamp(17px, 1.8vw, 21px);
      font-weight: 600;
    }

    .move-buttons {
      display: flex;
      gap: 4px;
    }

    .move-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: #174a38;
      background: rgba(255,255,255,.55);
      cursor: pointer;
      font-size: 19px;
      font-weight: 900;
    }

    .move-button:hover:not(:disabled) { background: rgba(255,255,255,.88); }
    .move-button:disabled { opacity: .28; cursor: default; }

    .feedback {
      display: none;
      grid-column: 3 / 4;
      margin-top: -3px;
      padding: 0 3px 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .feedback.show { display: block; }
    .correct .feedback { color: var(--green); }
    .wrong .feedback { color: var(--red); }

    .result {
      display: none;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 20px;
      padding: 21px 23px;
      border: 2px solid;
      border-radius: 15px;
    }

    .result.show { display: grid; }
    .result.success { border-color: #38a36d; background: linear-gradient(135deg, #e8f8ef, #f9fffb); }
    .result.failure { border-color: #e78776; background: linear-gradient(135deg, #fff0ec, #fffaf8); }

    .score {
      display: grid;
      place-items: center;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      color: #fff;
      background: var(--navy);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.18);
      text-align: center;
    }

    .success .score { background: var(--green); }
    .failure .score { background: var(--red); }

    .percentage { display: block; font-size: 29px; line-height: 1; font-weight: 900; }
    .fraction { display: block; margin-top: 5px; font-size: 14px; font-weight: 800; }

    .result-title { margin: 0 0 4px; color: var(--navy); font-size: 25px; }
    .result-text { margin: 0; font-size: 16px; }
    .result-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 11px;
      margin-top: 23px;
    }

    .action-button {
      min-height: 48px;
      padding: 11px 22px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease;
    }

    .action-button:hover { transform: translateY(-1px); }
    .action-button:focus-visible { outline: 4px solid rgba(23,105,170,.25); outline-offset: 2px; }
    .primary { color: #fff; background: var(--orange); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: var(--navy); background: #e7eef4; }
    .hidden { display: none !important; }

    @media (max-width: 820px) {
      .page { width: min(100% - 18px, 1160px); margin: 9px auto; border-radius: 15px; }
      .header, .content { padding-left: 21px; padding-right: 21px; }
      .intro { grid-template-columns: 1fr; }
      .match-row { grid-template-columns: 32px minmax(0, 1fr); gap: 8px 10px; }
      .stem { grid-column: 2; padding: 0; text-align: left; }
      .ending-card { grid-column: 2; }
      .feedback { grid-column: 2; }
    }

    @media (max-width: 520px) {
      .header { padding-top: 27px; }
      .content { padding-bottom: 32px; }
      .toolbar { align-items: flex-start; }
      .match-row { padding: 12px 9px; }
      .ending-card { grid-template-columns: 25px minmax(0, 1fr) auto; gap: 6px; }
      .move-button { width: 31px; height: 31px; }
      .actions { justify-content: stretch; }
      .action-button { flex: 1; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; box-shadow: none; }
      .actions, .hint, .move-buttons { display: none !important; }
      .match-row { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="unit" id="unitLabel"></p>
      <h1 id="quizTitle"></h1>
    </header>

    <section class="content">
      <div class="intro">
        <div>
          <h2 class="instruction" id="instruction"></h2>
          <p class="hint">Drag the green cards up or down. You can also tap two cards to swap them or use the arrow buttons.</p>
        </div>
        <div class="name-field">
          <label for="studentName">Student name (for the final screenshot)</label>
          <input id="studentName" type="text" maxlength="60" placeholder="Enter your name" autocomplete="name">
        </div>
      </div>

      <div class="toolbar">
        <span id="moveCounter">Cards moved: 0</span>
        <span class="attempt" id="attemptBadge">Attempt 1</span>
      </div>

      <div class="notice" id="notice" aria-live="polite"></div>

      <section class="result" id="resultPanel" aria-live="polite">
        <div class="score">
          <div>
            <span class="percentage" id="percentage">0%</span>
            <span class="fraction" id="fraction">0/10</span>
          </div>
        </div>
        <div>
          <h2 class="result-title" id="resultTitle"></h2>
          <p class="result-text" id="resultText"></p>
          <p class="result-meta" id="resultMeta"></p>
        </div>
      </section>

      <form id="quizForm" novalidate>
        <ol class="rows" id="rows"></ol>
        <div class="actions">
          <button class="action-button primary" id="checkButton" type="submit">✓ Check answers</button>
          <button class="action-button secondary hidden" id="retryButton" type="button">Try again</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /* ===========================================================
       TEACHER EDITING AREA
       Each id links one sentence beginning to its correct ending.
       Edit the title, instructions, beginnings, or endings here.
       =========================================================== */
    const settings = {
      title: "Vocabulary: Phrasal verbs: work & achievements (2)",
      unit: "STUDIO Advanced | Unit 5A",
      instruction: "Match to make motivational phrases."
    };

    const pairs = [
      { id: "pore", stem: "Stop poring", ending: "over your resume and send it." },
      { id: "play", stem: "Never play", ending: "down your achievements." },
      { id: "hold", stem: "Don't let anything hold", ending: "you back." },
      { id: "walk", stem: "Make it you who walks", ending: "away with the prize." },
      { id: "shrug", stem: "Just shrug", ending: "off undeserved criticism." },
      { id: "grapple", stem: "If you grapple", ending: "with problems, you can solve them." },
      { id: "pay", stem: "Your hard work will pay", ending: "off in the long run." },
      { id: "put", stem: "Don't put your success", ending: "down to luck." },
      { id: "take", stem: "If you were taken", ending: "on, you deserve the job." },
      { id: "single", stem: "Make sure you're singled", ending: "out for success." }
    ];

    // This reproduces the mixed order shown in the source exercise.
    const firstAttemptOrder = ["pay", "hold", "put", "pore", "single", "walk", "play", "grapple", "shrug", "take"];

    const rows = document.getElementById("rows");
    const form = document.getElementById("quizForm");
    const studentName = document.getElementById("studentName");
    const checkButton = document.getElementById("checkButton");
    const retryButton = document.getElementById("retryButton");
    const resultPanel = document.getElementById("resultPanel");
    const notice = document.getElementById("notice");

    const endingById = new Map(pairs.map(function (pair) { return [pair.id, pair.ending]; }));

    let currentOrder = firstAttemptOrder.slice();
    let selectedIndex = null;
    let draggedIndex = null;
    let moveCount = 0;
    let attempt = 1;
    let locked = false;
    let checkedState = null;
    let suppressNextClick = false;

    document.title = settings.title;
    document.getElementById("quizTitle").textContent = settings.title;
    document.getElementById("unitLabel").textContent = settings.unit;
    document.getElementById("instruction").textContent = settings.instruction;

    function announce(text) {
      notice.textContent = text;
      notice.classList.toggle("show", Boolean(text));
    }

    function updateMoveCounter() {
      document.getElementById("moveCounter").textContent = "Cards moved: " + moveCount;
    }

    function dragHandle() {
      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.setAttribute("aria-hidden", "true");
      for (let i = 0; i < 6; i += 1) handle.appendChild(document.createElement("span"));
      return handle;
    }

    function rowConfirmed(index) {
      return Boolean(checkedState && checkedState.correctness[index]);
    }

    function swapCards(firstIndex, secondIndex, focusIndex) {
      if (locked || rowConfirmed(firstIndex) || rowConfirmed(secondIndex) || firstIndex === secondIndex || firstIndex < 0 || secondIndex < 0 || firstIndex >= currentOrder.length || secondIndex >= currentOrder.length) return;

      const temporary = currentOrder[firstIndex];
      currentOrder[firstIndex] = currentOrder[secondIndex];
      currentOrder[secondIndex] = temporary;
      moveCount += 1;
      selectedIndex = null;
      updateMoveCounter();
      renderRows(focusIndex === undefined ? secondIndex : focusIndex);
      announce("Cards swapped. Continue arranging the phrases.");
    }

    function moveCard(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= currentOrder.length) return;
      swapCards(index, target, target);
    }

    function selectOrSwap(index) {
      if (locked || rowConfirmed(index) || suppressNextClick) return;

      if (selectedIndex === null) {
        selectedIndex = index;
        renderRows(index);
        announce("Card selected. Tap another green card to swap them.");
      } else if (selectedIndex === index) {
        selectedIndex = null;
        renderRows(index);
        announce("Selection cleared.");
      } else {
        const first = selectedIndex;
        swapCards(first, index, index);
      }
    }

    function feedbackText(rowIndex) {
      if (!checkedState) return "";
      return checkedState.correctness[rowIndex]
        ? "✓ Correct phrase."
        : "Try this match again. The correct ending is not shown.";
    }

    function renderRows(focusIndex) {
      rows.innerHTML = "";

      pairs.forEach(function (pair, rowIndex) {
        const confirmed = rowConfirmed(rowIndex);
        const item = document.createElement("li");
        item.className = "match-row";
        item.dataset.index = String(rowIndex);

        if (checkedState) item.classList.add(checkedState.correctness[rowIndex] ? "correct" : "wrong");

        item.addEventListener("dragover", function (event) {
          if (locked || confirmed) return;
          event.preventDefault();
          item.classList.add("drop-target");
        });

        item.addEventListener("dragleave", function () {
          item.classList.remove("drop-target");
        });

        item.addEventListener("drop", function (event) {
          if (locked || confirmed) return;
          event.preventDefault();
          item.classList.remove("drop-target");
          if (draggedIndex !== null) {
            suppressNextClick = true;
            swapCards(draggedIndex, rowIndex, rowIndex);
            window.setTimeout(function () { suppressNextClick = false; }, 80);
          }
          draggedIndex = null;
        });

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = String(rowIndex + 1);

        const stem = document.createElement("div");
        stem.className = "stem";
        stem.textContent = pair.stem;

        const card = document.createElement("div");
        card.className = "ending-card" + (selectedIndex === rowIndex ? " selected" : "") + (locked || confirmed ? " locked" : "");
        card.draggable = !locked && !confirmed;
        card.tabIndex = locked || confirmed ? -1 : 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", endingById.get(currentOrder[rowIndex]) + ". Position " + (rowIndex + 1) + ". Drag, tap to select, or use the arrow buttons.");
        card.appendChild(dragHandle());

        const text = document.createElement("span");
        text.className = "ending-text";
        text.textContent = endingById.get(currentOrder[rowIndex]);
        card.appendChild(text);

        const controls = document.createElement("span");
        controls.className = "move-buttons";

        [
          { symbol: "↑", direction: -1, label: "Move this card up" },
          { symbol: "↓", direction: 1, label: "Move this card down" }
        ].forEach(function (control) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "move-button";
          button.textContent = control.symbol;
          button.setAttribute("aria-label", control.label);
          const targetIndex = rowIndex + control.direction;
          button.disabled = locked || confirmed || targetIndex < 0 || targetIndex >= pairs.length || rowConfirmed(targetIndex);
          button.draggable = false;
          button.addEventListener("click", function (event) {
            event.stopPropagation();
            moveCard(rowIndex, control.direction);
          });
          controls.appendChild(button);
        });

        card.appendChild(controls);

        card.addEventListener("click", function () { selectOrSwap(rowIndex); });

        card.addEventListener("keydown", function (event) {
          if (locked || confirmed) return;
          if (event.key === "ArrowUp") {
            event.preventDefault();
            moveCard(rowIndex, -1);
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            moveCard(rowIndex, 1);
          } else if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectOrSwap(rowIndex);
          }
        });

        card.addEventListener("dragstart", function (event) {
          if (locked || confirmed) {
            event.preventDefault();
            return;
          }
          draggedIndex = rowIndex;
          suppressNextClick = true;
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(rowIndex));
        });

        card.addEventListener("dragend", function () {
          draggedIndex = null;
          card.classList.remove("dragging");
          document.querySelectorAll(".match-row").forEach(function (row) { row.classList.remove("drop-target"); });
          window.setTimeout(function () { suppressNextClick = false; }, 80);
        });

        const feedback = document.createElement("div");
        feedback.className = "feedback" + (checkedState ? " show" : "");
        feedback.textContent = feedbackText(rowIndex);

        item.appendChild(number);
        item.appendChild(stem);
        item.appendChild(card);
        item.appendChild(feedback);
        rows.appendChild(item);
      });

      if (focusIndex !== undefined && !locked) {
        const cardToFocus = rows.querySelector('.match-row[data-index="' + focusIndex + '"] .ending-card');
        if (cardToFocus) cardToFocus.focus({ preventScroll: true });
      }
    }

    function dateTime() {
      try {
        return new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      } catch (error) {
        return new Date().toLocaleString();
      }
    }

    function checkAnswers() {
      if (locked) return;

      selectedIndex = null;

      const originalOrder = currentOrder.slice();
      const correctness = pairs.map(function (pair, index) { return originalOrder[index] === pair.id; });
      const score = correctness.filter(Boolean).length;
      const perfect = score === pairs.length;
      const percent = Math.round(score / pairs.length * 100);
      locked = perfect;
      studentName.disabled = perfect;

      checkedState = { originalOrder: originalOrder, correctness: correctness };
      renderRows();

      document.getElementById("percentage").textContent = percent + "%";
      document.getElementById("fraction").textContent = score + "/" + pairs.length;
      resultPanel.className = "result show " + (perfect ? "success" : "failure");
      const mistakes = pairs.length - score;
      document.getElementById("resultTitle").textContent = perfect ? "Completed successfully" : mistakes + " " + (mistakes === 1 ? "mistake" : "mistakes");
      document.getElementById("resultText").textContent = perfect
        ? "All 10 phrases are correct. Take a screenshot of this page and send it to your teacher."
        : "Correct matches stay green and cannot be moved. Rearrange only the remaining cards, then check again. The answer key is not shown.";

      const name = studentName.value.trim();
      document.getElementById("resultMeta").textContent = (name ? name + " · " : "") + "Attempt " + attempt + " · " + dateTime();

      checkButton.classList.toggle("hidden", perfect);
      checkButton.textContent = perfect ? "✓ Check answers" : "✓ Check again";
      retryButton.className = perfect ? "action-button secondary" : "action-button secondary hidden";
      retryButton.textContent = "Start over";
      announce(perfect ? "100% achieved." : "Correct matches are locked. Rearrange only the remaining cards.");
      if (!perfect) {
        attempt += 1;
        document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      }
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function shuffledOrder() {
      const correct = pairs.map(function (pair) { return pair.id; });
      let shuffled;
      let attempts = 0;

      do {
        shuffled = correct.slice();
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          const temporary = shuffled[index];
          shuffled[index] = shuffled[randomIndex];
          shuffled[randomIndex] = temporary;
        }
        attempts += 1;
      } while (shuffled.filter(function (id, index) { return id === correct[index]; }).length > 2 && attempts < 50);

      return shuffled;
    }

    function resetAttempt() {
      attempt += 1;
      moveCount = 0;
      locked = false;
      selectedIndex = null;
      draggedIndex = null;
      checkedState = null;
      currentOrder = shuffledOrder();
      studentName.disabled = false;

      document.getElementById("attemptBadge").textContent = "Attempt " + attempt;
      resultPanel.className = "result";
      checkButton.classList.remove("hidden");
      checkButton.textContent = "✓ Check answers";
      retryButton.className = "action-button secondary hidden";
      updateMoveCounter();
      announce("New attempt started. Rearrange the green cards.");
      renderRows(0);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      checkAnswers();
    });

    retryButton.addEventListener("click", resetAttempt);

    updateMoveCounter();
    renderRows();
  </script>
</body>
</html>
